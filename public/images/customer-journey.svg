<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="35%" stop-color="#FFC759"/>
      <stop offset="75%" stop-color="#FF8C5A"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlowFinal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="30%" stop-color="#FFD976"/>
      <stop offset="70%" stop-color="#FF7A52"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC759" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: transparent, meant to sit on the site's own navy background -->

  <!-- Circuit-style connector spine -->
  <g filter="url(#lineGlowFilter)">
    <path d="M 140 210 L 1060 210" stroke="url(#lineGrad)" stroke-width="2" fill="none" opacity="0.55"/>
    <!-- small circuit branch ticks, echoing hero background style -->
    <path d="M 300 210 L 300 170 L 340 170" stroke="#FFC759" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M 300 210 L 300 250 L 340 250" stroke="#FF6B4A" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M 540 210 L 540 170 L 580 170" stroke="#FFC759" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M 540 210 L 540 250 L 580 250" stroke="#FF6B4A" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M 780 210 L 780 170 L 820 170" stroke="#FFC759" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M 780 210 L 780 250 L 820 250" stroke="#FF6B4A" stroke-width="1.5" fill="none" opacity="0.35"/>
  </g>

  <!-- Small traveling dots along the spine, suggesting motion/flow -->
  <circle cx="220" cy="210" r="3" fill="#FFD976"/>
  <circle cx="460" cy="210" r="3" fill="#FFC759"/>
  <circle cx="700" cy="210" r="3" fill="#FF8C5A"/>
  <circle cx="940" cy="210" r="3" fill="#FF6B4A"/>

  <!-- === NODE 1: Google Search === -->
  <g filter="url(#softGlow)">
    <circle cx="140" cy="210" r="38" fill="url(#nodeGlow)" opacity="0.9"/>
  </g>
  <circle cx="140" cy="210" r="26" fill="none" stroke="#FFC759" stroke-width="1.5" opacity="0.8"/>
  <circle cx="140" cy="210" r="4" fill="#1B2040"/>
  <text x="140" y="270" text-anchor="middle" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="15" font-weight="700">Google Search</text>
  <text x="140" y="292" text-anchor="middle" fill="#99A2C7" font-family="Arial, sans-serif" font-size="11.5">Where they find you</text>

  <!-- === NODE 2: Website === -->
  <g filter="url(#softGlow)">
    <circle cx="380" cy="210" r="38" fill="url(#nodeGlow)" opacity="0.9"/>
  </g>
  <circle cx="380" cy="210" r="26" fill="none" stroke="#FFC759" stroke-width="1.5" opacity="0.8"/>
  <circle cx="380" cy="210" r="4" fill="#1B2040"/>
  <text x="380" y="270" text-anchor="middle" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="15" font-weight="700">Website</text>
  <text x="380" y="292" text-anchor="middle" fill="#99A2C7" font-family="Arial, sans-serif" font-size="11.5">Where they decide to trust you</text>

  <!-- === NODE 3: Phone Call === -->
  <g filter="url(#softGlow)">
    <circle cx="620" cy="210" r="38" fill="url(#nodeGlow)" opacity="0.9"/>
  </g>
  <circle cx="620" cy="210" r="26" fill="none" stroke="#FFC759" stroke-width="1.5" opacity="0.8"/>
  <circle cx="620" cy="210" r="4" fill="#1B2040"/>
  <text x="620" y="270" text-anchor="middle" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="15" font-weight="700">Phone Call</text>
  <text x="620" y="292" text-anchor="middle" fill="#99A2C7" font-family="Arial, sans-serif" font-size="11.5">Where questions get answered</text>

  <!-- === NODE 4: Appointment === -->
  <g filter="url(#softGlow)">
    <circle cx="860" cy="210" r="38" fill="url(#nodeGlow)" opacity="0.9"/>
  </g>
  <circle cx="860" cy="210" r="26" fill="none" stroke="#FFC759" stroke-width="1.5" opacity="0.8"/>
  <circle cx="860" cy="210" r="4" fill="#1B2040"/>
  <text x="860" y="270" text-anchor="middle" fill="#F6F3EC" font-family="Arial, sans-serif" font-size="15" font-weight="700">Appointment</text>
  <text x="860" y="292" text-anchor="middle" fill="#99A2C7" font-family="Arial, sans-serif" font-size="11.5">Where it gets booked</text>

  <!-- === NODE 5: Customer (final, brighter/larger) === -->
  <g filter="url(#softGlow)">
    <circle cx="1080" cy="210" r="48" fill="url(#nodeGlowFinal)"/>
  </g>
  <circle cx="1080" cy="210" r="32" fill="none" stroke="#FFD976" stroke-width="2"/>
  <!-- tiny honeycomb hint inside the final node, echoing the hero sphere -->
  <g stroke="#FF6B4A" stroke-width="0.75" opacity="0.6" fill="none">
    <polygon points="1080,196 1088,201 1088,210 1080,215 1072,210 1072,201"/>
    <polygon points="1080,215 1088,220 1088,229 1080,234 1072,229 1072,220"/>
  </g>
  <text x="1080" y="278" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">Customer</text>
  <text x="1080" y="300" text-anchor="middle" fill="#FFC759" font-family="Arial, sans-serif" font-size="11.5">Where it pays off</text>

</svg>

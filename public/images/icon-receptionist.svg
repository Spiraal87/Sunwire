<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradReceptionist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC759"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2"/>

  <!-- Headset headband -->
  <path d="M 65 85 Q 65 45 100 45 Q 135 45 135 85"
        fill="none" stroke="url(#iconGradReceptionist)" stroke-width="3" stroke-linecap="round"/>

  <!-- Left ear cup -->
  <rect x="55" y="80" width="20" height="30" rx="6"
        fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2.5"/>

  <!-- Right ear cup -->
  <rect x="125" y="80" width="20" height="30" rx="6"
        fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2.5"/>

  <!-- Microphone boom -->
  <path d="M 135 105 Q 135 125 115 125"
        fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Microphone -->
  <rect x="105" y="120" width="20" height="10" rx="5"
        fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2"/>

  <!-- Phone handset -->
  <path d="M 75 115 Q 65 115 60 125 Q 55 135 60 145 Q 65 155 75 155 L 85 155 Q 90 155 90 150 L 90 145 Q 90 140 85 140 L 80 140 Q 75 140 75 135 L 75 125 Q 75 120 80 120 L 85 120 Q 90 120 90 115 L 90 110 Q 90 105 85 105 L 75 105"
        fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sound wave bars -->
  <line x1="95" y1="85" x2="95" y2="105" stroke="url(#iconGradReceptionist)" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="100" y2="110" stroke="url(#iconGradReceptionist)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="105" y1="85" x2="105" y2="105" stroke="url(#iconGradReceptionist)" stroke-width="2" stroke-linecap="round"/>

  <!-- Small dots for extended sound waves -->
  <circle cx="88" cy="95" r="1.5" fill="url(#iconGradReceptionist)"/>
  <circle cx="112" cy="95" r="1.5" fill="url(#iconGradReceptionist)"/>

  <!-- Wireless/signal waves -->
  <path d="M 145 65 Q 155 55 165 65" fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 150 72 Q 160 62 170 72" fill="none" stroke="url(#iconGradReceptionist)" stroke-width="2" stroke-linecap="round"/>
</svg>

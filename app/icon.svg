<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 380">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#F2C98A"/>
      <stop offset="45%" stop-color="#D99A50"/>
      <stop offset="100%" stop-color="#A8672A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="495" height="380" fill="#0A0B0F"/>

  <g>
    <!-- concentric rings, centered at (302,191) -->
    <circle cx="302" cy="191" r="138" fill="none" stroke="url(#goldGrad)" stroke-width="24"/>
    <circle cx="302" cy="191" r="100" fill="none" stroke="url(#goldGrad)" stroke-width="22"/>
    <circle cx="302" cy="191" r="66"  fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
    <circle cx="302" cy="191" r="34"  fill="none" stroke="url(#goldGrad)" stroke-width="12"/>

    <!-- crosshair cutting through rings, drawn in background color -->
    <rect x="292" y="30"  width="20" height="322" fill="#0A0B0F"/>
    <rect x="150" y="181" width="304" height="20"  fill="#0A0B0F"/>
  </g>

  <!-- circuit trace, left side, 3 nodes converging into the ring -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 40 155 L 78 155 L 100 173 L 165 173"/>
    <path d="M 40 191 L 165 191"/>
    <path d="M 40 227 L 78 227 L 100 209 L 165 209"/>
  </g>
  <g fill="#0A0B0F" stroke="url(#goldGrad)" stroke-width="6">
    <circle cx="40" cy="155" r="9"/>
    <circle cx="40" cy="191" r="9"/>
    <circle cx="40" cy="227" r="9"/>
  </g>
</svg>
